<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลนักศึกษา</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ระบบจัดการข้อมูลนักศึกษา</h1>
        <form id="student-form">
            <h2>เพิ่ม/แก้ไขข้อมูลนักศึกษา</h2>
            <input type="hidden" id="student-id-hidden">
            <div class="form-group">
                <label for="first_name">ชื่อ:</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">สกุล:</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label for="student_id">รหัสประจำตัว:</label>
                <input type="text" id="student_id" required>
            </div>
            <div class="form-group">
                <label for="date_of_birth">วันเกิด:</label>
                <input type="date" id="date_of_birth" required>
            </div>
            <div class="form-group">
                <label for="gender">เพศ:</label>
                <select id="gender" required>
                    <option value="">-- กรุณาเลือก --</option>
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                    <option value="อื่น ๆ">อื่น ๆ</option>
                </select>
            </div>
            <button type="submit" id="submit-button">เพิ่มข้อมูล</button>
        </form>
        <hr>
        <h2>รายชื่อนักศึกษา</h2>
        <table id="student-table">
            <thead>
                <tr>
                    <th>รหัสประจำตัว</th>
                    <th>ชื่อ-สกุล</th>
                    <th>วันเกิด</th>
                    <th>เพศ</th>
                    <th>การจัดการ</th>
                </tr>
            </thead>
            <tbody id="student-table-body"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
